name: Build EXE + APK

# 产出两个交付物：
#   windows-exe : dist/MiRecoveryHelper.exe   （免安装单文件，用 PyInstaller）
#   windows-msi : Briefcase 生成的 MSI 安装包（可选，失败不影响其它产物）
#   android-apk : Briefcase 生成的 APK        （用 Toga 的 Android 后端）
#
# 触发方式：推送到 main / 手动 Run workflow / 打 tag

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ 测试
  test:
    name: 测试（文字检索 + 图片识别）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装图像依赖
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy

      # 校验打包入口点需要 tkinter（tkapp 备选界面，仅用标准库）。
      # toga 无需安装：打包入口点校验只复现 PyInstaller 的执行上下文，
      # 不构建窗口，脚本会在缺少 toga 时使用占位实现。
      - name: 安装 tkinter（Ubuntu 下不在标准库中）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: 生成知识库 kb.json
        run: python tools/build_kb.py

      - name: 生成图片参考库（合成参考图 + 特征提取）
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/make_reference_images.py --clean
          python tools/build_references.py

      - name: 运行完整测试（8 个文字用例 + 图片识别检查）
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/smoke_test.py

      - name: 图片识别基准（合成图，报告精度）
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/benchmark_recognition.py

      - name: 校验打包入口点（防止相对导入导致的启动崩溃）
        run: python tools/verify_entrypoints.py

      - name: 上传数据文件（供后续 job 复用）
        uses: actions/upload-artifact@v4
        with:
          name: app-data
          path: |
            src/mirecovery/data/kb.json
            src/mirecovery/data/image_refs.json

  # ------------------------------------------------------- Windows .exe
  windows-exe:
    name: Windows 单文件 EXE
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "toga>=0.4.0" pillow numpy pyinstaller

      - name: 生成知识库 + 图标 + 图片参考库
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/build_kb.py
          python tools/make_icon.py
          python tools/make_reference_images.py --clean
          python tools/build_references.py

      - name: 用 PyInstaller 打单文件 exe
        run: pyinstaller --noconfirm MiRecoveryHelper.spec

      # 本 job 已装 toga，因此这里跑的是对真实 toga 模块的校验。
      - name: 校验打包入口点（真实 toga 环境）
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/verify_entrypoints.py

      - name: 确认 exe 存在
        shell: pwsh
        run: |
          if (-not (Test-Path dist/MiRecoveryHelper.exe)) {
            throw "dist/MiRecoveryHelper.exe 未生成"
          }
          Get-Item dist/MiRecoveryHelper.exe | Select-Object Name, Length

      - name: 冒烟测试打包后的 exe（冻结自检）
        shell: pwsh
        run: |
          pyinstaller --noconfirm --distpath dist --workpath build/selftest MiRecoveryHelper.selftest.spec
          & dist/MiRecoveryHelperSelfTest.exe
          if ($LASTEXITCODE -ne 0) { throw "冻结自检失败：exe 内知识库不可用" }

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: MiRecoveryHelper-windows-exe
          path: dist/MiRecoveryHelper.exe
          if-no-files-found: error

  # ------------------------------------------------------ Android .apk
  android-apk:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase

      - name: 生成知识库 + 图标 + 图片参考库
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/build_kb.py
          python tools/make_icon.py
          python tools/make_reference_images.py --clean
          python tools/build_references.py

      - name: 缓存 Android SDK / NDK / Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/briefcase
            ~/.gradle
          key: briefcase-android-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            briefcase-android-${{ runner.os }}-

      - name: 创建 Android 工程
        run: briefcase create android

      - name: 构建 APK
        run: briefcase build android

      - name: 打包 APK
        run: briefcase package android --no-input

      - name: 确认产物存在
        run: |
          ls -l dist/
          test -n "$(find dist -maxdepth 1 -name '*.apk' -print -quit)" \
            || { echo "::error::dist/ 下没有生成 apk"; exit 1; }

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MiRecoveryHelper-android-apk
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error

  # ------------------------------------------- 可选：Windows MSI 安装包
  windows-msi:
    name: Windows MSI（可选）
    needs: test
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase

      - name: 生成知识库 + 图标
        run: |
          python tools/build_kb.py
          python tools/make_icon.py

      - name: 构建并打包 MSI
        run: |
          briefcase create windows
          briefcase build windows
          briefcase package windows --no-input

      - name: 上传 MSI
        uses: actions/upload-artifact@v4
        with:
          name: MiRecoveryHelper-windows-msi
          path: dist/*.msi
          if-no-files-found: warn
