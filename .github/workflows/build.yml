name: Build EXE + APK

# 产出：
#   windows-exe : rec检查喵.exe + 目录版 + 便携压缩包（PyInstaller）
#   android-apk : rec检查喵-*.apk（Briefcase + Chaquopy）
#   windows-msi : MSI 安装包（可选，失败不影响其它产物）
#
# 重要：本工作流在本机从未运行过（本机没有 JDK 17、没有 git、磁盘也不够）。
# 它是一份**未经验证**的配置，首次推送时很可能需要调试。请把它当作起点，
# 而不是"已经能出 apk"的保证。详见 README「4.7 APK 的真实状态」。

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  # Pin the toolchain so a CI run is reproducible; bump deliberately.
  BRIEFCASE_VERSION: "0.4.5"

jobs:
  # ------------------------------------------------------------------ 测试
  test:
    name: 测试（pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pillow pytest

      - name: 生成知识库
        run: python tools/build_kb.py

      - name: 生成图片参考库（合成参考图 + 特征提取）
        run: |
          python tools/make_reference_images.py --clean
          python tools/build_references.py

      - name: 运行测试
        # 走 tools/run_tests.py：GUI 测试单独一个进程。同一个进程里同时用 tkinter
        # 与 Windows OCR 会在解释器退出时崩（0xC0000005），所有用例其实都通过了。
        run: python tools/run_tests.py

      - name: 图片识别基准（合成图，输出精度）
        run: python tools/benchmark_recognition.py

      - name: 上传数据文件（供后续 job 复用）
        uses: actions/upload-artifact@v4
        with:
          name: app-data
          path: |
            src/mirecovery/data/kb.json
            src/mirecovery/data/image_refs.json

  # ------------------------------------------------------- Windows .exe
  windows-exe:
    name: Windows 交付物
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "toga>=0.4.0" pillow pyinstaller

      - name: 生成知识库 + 图标 + 图片参考库
        run: |
          python tools/build_kb.py
          python tools/make_icon.py
          python tools/make_reference_images.py --clean
          python tools/build_references.py

      - name: 构建全部交付物（含冻结自检）
        # build_exe.py 会自己跑一遍打包后的自检程序，确认知识库、参考库、
        # tkinter 都在 exe 内可用；失败则整个 job 失败。
        run: python tools/build_exe.py

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, Length

      - name: 上传 EXE 与便携包
        uses: actions/upload-artifact@v4
        with:
          name: recneko-windows
          path: |
            dist/rec检查喵.exe
            dist/rec检查喵-toga.exe
            dist/rec检查喵-portable.zip
            dist/使用说明.txt
          if-no-files-found: error

  # ------------------------------------------------------ Android .apk
  android-apk:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Briefcase
        run: |
          python -m pip install --upgrade pip
          pip install "briefcase==${{ env.BRIEFCASE_VERSION }}"

      - name: 生成知识库 + 图标 + 图片参考库
        run: |
          python tools/build_kb.py
          python tools/make_icon.py
          python tools/make_reference_images.py --clean
          python tools/build_references.py

      - name: 缓存 Android SDK / NDK / Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/briefcase
            ~/.gradle
          key: briefcase-android-${{ runner.os }}-${{ env.BRIEFCASE_VERSION }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            briefcase-android-${{ runner.os }}-${{ env.BRIEFCASE_VERSION }}-

      - name: 创建 Android 工程
        run: briefcase create android

      - name: 构建 APK
        run: briefcase build android

      - name: 打包 APK
        run: briefcase package android --no-input

      - name: 确认产物存在
        run: |
          ls -l dist/
          test -n "$(find dist -maxdepth 1 -name '*.apk' -print -quit)" \
            || { echo "::error::dist/ 下没有生成 apk"; exit 1; }

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: recneko-android
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error

  # ------------------------------------------- 可选：Windows MSI 安装包
  windows-msi:
    name: Windows MSI（可选）
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Briefcase
        run: |
          python -m pip install --upgrade pip
          pip install "briefcase==${{ env.BRIEFCASE_VERSION }}"

      - name: 生成知识库 + 图标
        run: |
          python tools/build_kb.py
          python tools/make_icon.py

      - name: 构建并打包 MSI
        run: |
          briefcase create windows
          briefcase build windows
          briefcase package windows --no-input

      - name: 上传 MSI
        uses: actions/upload-artifact@v4
        with:
          name: recneko-windows-msi
          path: dist/*.msi
          if-no-files-found: warn
